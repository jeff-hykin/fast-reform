[package]
name = "fast-reform"
version = "0.1.0"
edition = "2021"
description = "Apply bone-like deformation to point clouds quickly."
license = "Apache-2.0"
repository = "https://github.com/jeff-hykin/fast-reform"
readme = "README.md"
keywords = ["pointcloud", "slam", "deformation", "lidar", "robotics"]
categories = ["science::robotics", "algorithms"]

[lib]
crate-type = ["cdylib", "rlib"]

# rayon is only pulled in on native targets; the wasm build (raw C-ABI, no
# wasm-bindgen) falls back to a serial per-point loop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
